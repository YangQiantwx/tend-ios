name: Tend
options:
  bundleIdPrefix: org.tend
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
targets:
  Tend:
    type: application
    platform: iOS
    sources:
      - path: Tend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tend.app
        INFOPLIST_KEY_CFBundleDisplayName: Tend
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Tend/Info.plist
      properties:
        CFBundleDisplayName: Tend
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen:
          UIColorName: ''
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - tend
  TendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TendUITests
    dependencies:
      - target: Tend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tend:
    build:
      targets:
        Tend: all
        TendUITests: [test]
    test:
      targets:
        - TendUITests
